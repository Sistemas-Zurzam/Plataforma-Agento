[program:agento-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/Plataforma-Agento/agento-backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/Plataforma-Agento/agento-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/Plataforma-Agento/agento-backend/storage/logs/worker.log
stopwaitsecs=3600
