# VirtualHost de producción para agento.com.pe.
#
# Requisitos:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo cp apache.conf /etc/apache2/sites-available/agento.conf
#   sudo a2ensite agento.conf
#
# Este VirtualHost HTTP se activa primero para que Let's Encrypt pueda validar
# el dominio. Después de que el DNS apunte al servidor, Certbot crea el bloque
# HTTPS y configura la redirección:
#   sudo certbot --apache -d agento.com.pe -d www.agento.com.pe --redirect

<VirtualHost *:80>
    ServerName agento.com.pe
    ServerAlias www.agento.com.pe

    DocumentRoot /var/www/Plataforma-Agento/agento-frontend/dist

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    <Directory /var/www/Plataforma-Agento/agento-frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    <LocationMatch "^/api/">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/agento-error.log
    CustomLog ${APACHE_LOG_DIR}/agento-access.log combined
</VirtualHost>
