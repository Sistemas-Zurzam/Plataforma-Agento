# Configuración de producción para agento.com.pe.
# Sirve el build estático de `npm run build` (carpeta dist/) y hace proxy de
# /api/ hacia el backend Laravel, para que frontend y API compartan el mismo
# origen (agento.com.pe) y no se necesite configurar CORS.
#
# AppLayout.jsx navega con window.history.pushState (rutas como
# /nominas/remuneraciones sin recargar la página) — eso funciona perfecto
# navegando DENTRO de la app, pero si el navegador pide esa URL directamente
# (refresh, link compartido, favorito), nginx tiene que servir igual
# index.html, o el usuario ve un 404 real del servidor. Por eso el
# "try_files ... /index.html" de abajo es obligatorio para esta app.

server {
    listen 443 ssl http2;
    server_name agento.com.pe www.agento.com.pe;

    ssl_certificate     /etc/letsencrypt/live/agento.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agento.com.pe/privkey.pem;

    root /var/www/Plataforma-Agento/agento-frontend/dist;
    index index.html;

    # Proxy hacia el backend Laravel (ajustar el puerto al que realmente
    # exponga php-fpm/artisan serve/octane en el servidor).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: cualquier ruta que no sea un archivo real cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea agresivamente los assets con hash en el nombre (JS/CSS/fuentes
    # generados por Vite) — index.html en cambio NUNCA debe cachearse fuerte,
    # porque es el único archivo que cambia entre despliegues sin cambiar de URL.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name agento.com.pe www.agento.com.pe;
    return 301 https://$host$request_uri;
}
